services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uber
      POSTGRES_USER: uber
      POSTGRES_PASSWORD: uber
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uber -d uber"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/uber
      DB_USERNAME: uber
      DB_PASSWORD: uber
      DB_POOL_SIZE: 20
      APP_TOKEN_KEY: ${APP_TOKEN_KEY:?Set APP_TOKEN_KEY to a base64-encoded key}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
      PAYMENT_RECONCILIATION_DELAY_MS: ${PAYMENT_RECONCILIATION_DELAY_MS:-60000}
      PAYMENT_RECONCILIATION_INITIAL_DELAY_MS: ${PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:-30000}
      CANCEL_FEE_AFTER_ACCEPT_NAIRA: ${CANCEL_FEE_AFTER_ACCEPT_NAIRA:-300}
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-20}
    ports:
      - "8080:8080"
volumes:
  postgres_data: