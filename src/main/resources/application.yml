spring:
  application:
    name: uber-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uber}
    username: ${DB_USERNAME:uber}
    password: ${DB_PASSWORD:uber}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
app:
  security:
    jwt-secret: ${APP_TOKEN_KEY}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  pricing:
    base-fare-naira: ${BASE_FARE_NAIRA:500}
    per-km-fare-naira: ${PER_KM_FARE_NAIRA:150}
server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 20
    accept-count: 500
    max-connections: 8192
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    com.chekwube.uber: INFO